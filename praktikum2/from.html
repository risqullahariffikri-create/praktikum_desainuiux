<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Form Pemesanan Pizza</h1>
    <p>Silahkan isi form dibawah ini untuk memesan pizza</p>

    <form action="http://www.blackgoosebistro.com/pizza.php" method="POST">
        <fieldset>
            <legend>Informasi Pemesan</legend>
            <p>
                <label for="costumername">Nama:</label>
                <input type="text" name="costumername" id="costumername" required />
            </p>
            <p>
                <label for="address">address:</label>
                <input type="text" name="address" id="address" required />
            </p>
            <p>
                <label for="telephone">telephone:</label>
                <input type="text" name="telephone" id="telephone" required />
            </p>
            <p>
                <label for="email">email:</label>
                <input type="email" name="email" id="email" required />
            </p>

            <p>
                <label for="intruction">delivery intruction:</label><br>
                <textarea
                id="intruction"
                name="intruction"
                rows="4"
                cols="50"
                maxlength="400"
                placeholder="no more than 400 character"></textarea>
            </p>
            </fieldset>

            <fieldset>
                <legend>design your dream pizza</legend>
                
                <p><strong>pizza specs</strong></p>
                <p>pilih salah satu</p>

                <p>
                    <input type="radio" id="classic" name="crust" value="classic white" required>
                    <label for="classic">classic white</label><br>

                    <input type="radio" id="classic" name="crust" value="paperroni" required>
                    <label for="classic">paperroni</label><br>

                    <input type="radio" id="classic" name="crust" value="sosis" required>
                    <label for="classic">sosis</label><br>

                    <input type="radio" id="classic" name="crust" value="pizza" required>
                    <label for="classic">pizza</label><br>

                </p>

                
            <p><strong>Toppings</strong></p>

            <p>
                <input type="checkbox" name="toppings" id="red-sauce" value="red-sauce" required />
                <label for="red-sauce">Red Sauce</label><br>

                <input type="checkbox" name="toppings" id="white-sauce" value="white-sauce" required />
                <label for="white-sauce">White Sauce</label><br>

                <input type="checkbox" name="toppings" id="mozzarella" value="mozzarella" required />
                <label for="mozzarella">Mozzarella Cheese</label><br>

                <input type="checkbox" name="toppings" id="cheese" value="cheese" required />
                <label for="cheese">Cheese</label>
            </p>

               <p>
                <label for="quantity">Quantity:</label>
                <select name="quantity" id="quantity">
                    <option value="">Pilih Jumlah</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </p>
            </fieldset>

               <p>
            <input type="submit" value="Submit" />
            <input type="reset" value="Reset" />
        </p>
    </form>
  </body>
</html>
